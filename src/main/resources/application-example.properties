# ============ SERVER CONFIGURATION ============
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ============ EMAIL CONFIGURATION (Disabled - Uncomment when needed) ============
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true

# ============ SPRING APPLICATION NAME ============
spring.application.name=english-12-smart

# ============ MONGODB CONFIGURATION ============
# Local MongoDB
# spring.data.mongodb.uri=mongodb://localhost:27017/english_12_smart
# spring.data.mongodb.database=english_12_smart

# MongoDB Atlas (Cloud) - Uncomment and replace with your credentials
spring.data.mongodb.uri=mongodb+srv://USERNAME:PASSWORD@cluster.mongodb.net/english_12_smart?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.database=english_12_smart
spring.data.mongodb.auto-index-creation=false

# ============ REDIS CONFIGURATION ============
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000

# ============ JWT SECURITY CONFIGURATION ============
jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32_CHARACTERS_OR_MORE
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# ============ FILE UPLOAD CONFIGURATION ============
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload.directory=uploads/

# ============ CLOUDINARY CONFIGURATION ============
cloudinary.cloud-name=YOUR_CLOUDINARY_CLOUD_NAME
cloudinary.api-key=YOUR_CLOUDINARY_API_KEY
cloudinary.api-secret=YOUR_CLOUDINARY_API_SECRET
cloudinary.upload-folder=english-12-smart

# ============ GOOGLE CLOUD CONFIGURATION ============
google.cloud.project-id=YOUR_GOOGLE_PROJECT_ID
google.cloud.credentials-path=path/to/credentials.json

# ============ OAUTH2 GOOGLE LOGIN CONFIGURATION ============
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ============ LOGGING CONFIGURATION ============
logging.level.root=WARN
logging.level.com.english12smart=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============ THYMELEAF CONFIGURATION ============
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# ============ JACKSON CONFIGURATION ============
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ============ ACTUATOR CONFIGURATION ============
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# ============ DEVELOPMENT OPTIMIZATIONS ============
spring.main.banner-mode=off
spring.main.lazy-initialization=true
spring.jmx.enabled=false
spring.devtools.restart.enabled=false
