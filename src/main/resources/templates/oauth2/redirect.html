<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang đăng nhập...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center">
    <div class="text-center">
        <div class="mb-6">
            <div
                class="inline-block h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-600 border-r-transparent">
            </div>
        </div>
        <h1 class="text-2xl font-semibold text-slate-900 mb-2">Đang đăng nhập...</h1>
        <p class="text-slate-600">Vui lòng đợi trong giây lát</p>
    </div>

    <script>
        console.log('🔵 [OAuth2] Redirect page loaded');

        // Lấy thông tin từ URL params
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const name = urlParams.get('name');
        const token = urlParams.get('token');
        const role = urlParams.get('role');
        const avatarUrl = urlParams.get('avatarUrl');

        console.log('📋 [OAuth2] URL Params:', {
            email: email,
            name: name,
            token: token ? token.substring(0, 20) + '...' : 'NO',
            role: role,
            avatarUrl: avatarUrl ? 'YES' : 'NO'
        });

        if (email && token) {
            console.log('✅ [OAuth2] Token received. Saving to localStorage...');
            
            try {
                // Lưu JWT token vào localStorage (cho client-side use)
                localStorage.setItem('token', token);
                console.log('✅ [OAuth2] Token saved to localStorage');
                
                // Lưu user info
                const userObj = { email, name, role, avatarUrl };
                localStorage.setItem('user', JSON.stringify(userObj));
                console.log('✅ [OAuth2] User object saved');

                // Xác định URL dựa trên role
                let redirectUrl = '/'; // Redirect về home page
                
                console.log('🎯 [OAuth2] Redirecting to:', redirectUrl);
                console.log('💡 Note: Token is also saved in HttpOnly cookie, so server can authenticate');
                
                // Redirect đến home page
                // Token đã được lưu trong cookie (HttpOnly) khi OAuth2LoginSuccessHandler xử lý
                // Nên server sẽ nhận được token tự động mà không cần gửi trong header
                setTimeout(() => {
                    console.log('🚀 [OAuth2] Navigating to:', redirectUrl);
                    window.location.href = redirectUrl;
                }, 1000);
            } catch (error) {
                console.error('❌ [OAuth2] Error:', error);
                document.getElementById('msg').textContent = 'Lỗi: ' + error.message;
            }
        } else {
            console.error('❌ [OAuth2] Missing params!', { email: !!email, token: !!token });
            
            setTimeout(() => {
                console.log('🚀 [OAuth2] Redirecting to login');
                window.location.href = '/auth/login?error=oauth2-failed';
            }, 1500);
        }
    </script>
</body>

</html>
