<!DOCTYPE html>
<html lang="vi" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra - English 12 Smart</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>window.process = { env: { NODE_ENV: 'development' } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>

<body class="bg-slate-50 text-slate-600 antialiased font-sans">
    <!-- STUDENT NAVBAR với currentPage='exams' -->
    <th:block th:replace="shared/student-navbar :: student-navbar(currentPage='exams')"></th:block>

    <main class="pt-20 pb-12">
        <!-- Page Header -->
        <div class="bg-gradient-to-r from-violet-500 to-violet-700 text-white py-12">
            <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 text-center">
                <h1 class="text-3xl font-medium mb-2">Kiểm Tra</h1>
                <p class="text-violet-100">Nhập mã PIN để vào làm bài thi</p>
            </div>
        </div>

        <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 mt-8 space-y-8">

            <!-- Ô nhập mã PIN -->
            <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center shadow-sm">
                <div class="h-16 w-16 rounded-full bg-violet-100 flex items-center justify-center mx-auto mb-5">
                    <iconify-icon icon="solar:key-bold" width="28" class="text-violet-600"></iconify-icon>
                </div>
                <h2 class="text-xl font-semibold text-slate-900 mb-2">Nhập Mã PIN</h2>
                <p class="text-slate-500 text-sm mb-6">Giáo viên sẽ cung cấp mã PIN 5 chữ số trước khi thi</p>

                <!-- Input PIN với auto-focus và pattern giới hạn số -->
                <div class="flex items-center gap-3 justify-center mb-4">
                    <input type="text" id="pinInput"
                        maxlength="5" pattern="[0-9]{5}"
                        inputmode="numeric"
                        placeholder="_ _ _ _ _"
                        class="w-48 text-center text-3xl font-black tracking-[0.5em] px-4 py-4 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-200 transition-all"
                        onkeyup="if(this.value.length === 5 && event.key === 'Enter') joinExam()">
                </div>

                <!-- Thông báo lỗi PIN -->
                <p id="pinError" class="text-sm text-red-500 mb-4 hidden"></p>

                <button onclick="joinExam()"
                    class="px-8 py-3 bg-violet-600 text-white rounded-xl font-medium text-base hover:bg-violet-700 transition-colors inline-flex items-center gap-2">
                    <iconify-icon icon="solar:arrow-right-linear" width="20"></iconify-icon>
                    Vào Thi
                </button>
            </div>

            <!-- Lịch sử thi -->
            <div class="bg-white rounded-xl border border-slate-200">
                <div class="p-6 border-b border-slate-100">
                    <h2 class="text-lg font-semibold text-slate-900">Lịch Sử Thi</h2>
                    <p class="text-sm text-slate-500 mt-0.5">Các bài thi bạn đã hoàn thành</p>
                </div>

                <!-- Chưa có lịch sử -->
                <div th:if="${#lists.isEmpty(examHistory)}" class="py-12 text-center text-slate-400">
                    <iconify-icon icon="solar:diploma-linear" width="40" class="mb-3 opacity-40"></iconify-icon>
                    <p class="text-sm">Bạn chưa tham gia bài thi nào</p>
                </div>

                <!-- Danh sách lịch sử thi -->
                <div th:if="${not #lists.isEmpty(examHistory)}" class="divide-y divide-slate-100">
                    <div th:each="sub : ${examHistory}" class="p-5 flex items-center justify-between gap-4 hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-4">
                            <!-- Badge điểm tròn -->
                            <div class="h-12 w-12 rounded-xl flex items-center justify-center shrink-0"
                                th:classappend="${sub.percentage != null and sub.percentage >= 80} ? 'bg-emerald-100 text-emerald-700' : (${sub.percentage != null and sub.percentage >= 50} ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700')">
                                <span class="text-sm font-bold"
                                    th:text="${sub.percentage != null ? #numbers.formatDecimal(sub.percentage, 1, 0) + '%' : '?'}">80%</span>
                            </div>
                            <div>
                                <p class="font-medium text-slate-900 text-sm" th:text="${sub.examTitle}">Tên đề thi</p>
                                <p class="text-xs text-slate-500 mt-0.5">
                                    <span th:text="${sub.score}">0</span>/<span th:text="${sub.totalScore}">0</span> điểm
                                    <span class="mx-1">•</span>
                                    <span th:text="${sub.timeTakenDisplay}">5m 30s</span>
                                </p>
                            </div>
                        </div>
                        <!-- Nút xem lại kết quả -->
                        <a th:href="'/dashboard/student/exam/' + ${sub.examId} + '/result'"
                            class="px-3 py-1.5 text-sm text-violet-600 border border-violet-200 rounded-lg hover:bg-violet-50 transition-colors shrink-0">
                            Xem lại
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- STUDENT FOOTER -->
    <th:block th:insert="shared/student-footer"></th:block>

    <!-- Script xử lý nhập PIN và điều hướng vào thi -->
    <script>
        /**
         * Xử lý khi học sinh nhấn "Vào Thi":
         * 1. Gọi API kiểm tra PIN
         * 2. Nếu hợp lệ → gọi API bắt đầu thi → chuyển đến trang làm bài
         */
        async function joinExam() {
            const pin = document.getElementById('pinInput').value.trim();
            const errorEl = document.getElementById('pinError');

            // Kiểm tra PIN đủ 5 số
            if (pin.length !== 5 || !/^\d{5}$/.test(pin)) {
                errorEl.textContent = 'Mã PIN phải gồm đúng 5 chữ số';
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            const btn = document.querySelector('button[onclick="joinExam()"]');
            btn.disabled = true;
            btn.innerHTML = '<iconify-icon icon="solar:refresh-linear" width="18" class="animate-spin inline"></iconify-icon> Đang kiểm tra...';

            try {
                const token = localStorage.getItem('accessToken') || '';

                // Bước 1: Lấy thông tin đề thi theo PIN
                const res = await fetch('/api/exams/pin/' + pin, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();

                if (!res.ok || data.statusCode !== 200) {
                    throw new Error(data.message || 'Mã PIN không hợp lệ');
                }

                const exam = data.data;

                // Bước 2: Bắt đầu thi - tạo submission
                const startRes = await fetch('/api/exams/' + exam.id + '/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                });
                const startData = await startRes.json();

                if (!startRes.ok || startData.statusCode !== 200) {
                    throw new Error(startData.message || 'Không thể bắt đầu bài thi');
                }

                // Lưu submissionId vào sessionStorage để trang làm bài sử dụng
                sessionStorage.setItem('submissionId_' + exam.id, startData.data.submissionId);

                // Chuyển đến trang làm bài
                window.location.href = '/dashboard/student/exam/' + exam.id;

            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<iconify-icon icon="solar:arrow-right-linear" width="20"></iconify-icon> Vào Thi';
            }
        }

        // Cho phép nhấn Enter để vào thi
        document.getElementById('pinInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') joinExam();
        });

        // Tự động focus vào ô PIN khi tải trang
        document.getElementById('pinInput').focus();
    </script>
</body>
</html>
