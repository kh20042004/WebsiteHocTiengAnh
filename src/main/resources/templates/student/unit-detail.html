<!DOCTYPE html>
<html lang="vi" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${unit.title} + ' - Bài học'">Bài học</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>

<body class="bg-slate-50 text-slate-600 antialiased font-sans">

    <!-- SHARED STUDENT NAVBAR -->
    <th:block th:replace="shared/student-navbar :: student-navbar(currentPage='learn')"></th:block>

    <!-- NỘI DUNG CHÍNH -->
    <main class="pt-16 min-h-screen">
        <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-8">

            <!-- BREADCRUMB -->
            <nav class="flex items-center gap-2 text-sm text-slate-400 mb-6">
                <a href="/dashboard/student/learn" class="hover:text-emerald-600 transition-colors">Học tập</a>
                <iconify-icon icon="mdi:chevron-right"></iconify-icon>
                <span class="text-slate-700 font-medium" th:text="${unit.title}">Unit</span>
            </nav>

            <!-- HEADER UNIT -->
            <div class="bg-gradient-to-r from-blue-500 to-blue-700 text-white rounded-2xl p-6 mb-8">
                <div class="flex items-start justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full" th:text="'Unit ' + ${unit.orderIndex}">Unit 1</span>
                            <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full" th:text="${unit.level}">B1</span>
                        </div>
                        <h1 class="text-2xl font-bold" th:text="${unit.title}">Unit Title</h1>
                        <p class="text-blue-100 mt-1 text-sm" th:text="${unit.description}">Mô tả</p>
                    </div>
                    <div class="text-right">
                        <div class="text-3xl font-bold" th:text="${unit.totalLessons}">0</div>
                        <div class="text-xs text-blue-100">bài học</div>
                    </div>
                </div>
            </div>

            <!-- DANH SÁCH BÀI HỌC -->
            <h2 class="text-lg font-semibold text-slate-900 mb-4">Các bài học</h2>

            <!-- Chưa có bài học -->
            <div th:if="${#lists.isEmpty(unit.lessons)}" class="text-center py-12 bg-white rounded-xl border border-slate-200">
                <iconify-icon icon="mdi:book-open-outline" class="text-5xl text-slate-300 mb-3"></iconify-icon>
                <p class="text-slate-400">Chưa có bài học nào trong unit này.</p>
            </div>

            <!-- Danh sách bài học dạng list -->
            <div th:unless="${#lists.isEmpty(unit.lessons)}" class="space-y-3">
                <a th:each="lesson, stat : ${unit.lessons}"
                    th:href="@{/learn/lessons/{id}(id=${lesson.id})}"
                    class="group flex items-center gap-4 bg-white border border-slate-200 rounded-xl p-4 hover:border-emerald-300 hover:shadow-sm transition-all">

                    <!-- Số thứ tự -->
                    <div class="h-10 w-10 rounded-full flex items-center justify-center shrink-0 text-sm font-bold"
                        th:classappend="${lesson.type == 'VOCABULARY'} ? 'bg-purple-100 text-purple-700' :
                                       (${lesson.type == 'GRAMMAR'} ? 'bg-blue-100 text-blue-700' :
                                       (${lesson.type == 'READING'} ? 'bg-amber-100 text-amber-700' :
                                       (${lesson.type == 'LISTENING'} ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-700')))"
                        th:text="${lesson.orderIndex}">1</div>

                    <!-- Thông tin bài học -->
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-slate-900 group-hover:text-emerald-700 transition-colors" th:text="${lesson.title}">Tên bài</div>
                        <div class="flex items-center gap-3 mt-0.5 text-xs text-slate-400">
                            <span th:text="${lesson.type}">GRAMMAR</span>
                            <span>•</span>
                            <span th:text="${lesson.estimatedDurationMinutes} + ' phút'">30 phút</span>
                            <span>•</span>
                            <span class="text-emerald-600 font-medium" th:text="${lesson.xpReward} + ' XP'">10 XP</span>
                        </div>
                    </div>

                    <!-- Icon &  Bài tập -->
                    <div class="flex items-center gap-3 shrink-0">
                        <span class="text-xs text-slate-400" th:text="${lesson.totalExercises} + ' bài tập'">0 bài tập</span>
                        <iconify-icon icon="mdi:chevron-right" class="text-slate-400 group-hover:text-emerald-500 transition-colors"></iconify-icon>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <!-- SHARED STUDENT FOOTER -->
    <th:block th:replace="shared/student-footer :: student-footer"></th:block>

</body>
</html>
