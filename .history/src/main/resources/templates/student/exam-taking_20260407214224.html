<!DOCTYPE html>
<html lang="vi" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${exam != null ? exam.title + ' - English 12 Smart' : 'Làm Bài Thi'}">Làm Bài Thi</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>window.process = { env: { NODE_ENV: 'development' } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>

<body class="bg-slate-100 text-slate-600 antialiased font-sans">

    <!-- Thanh trên cùng: thông tin đề thi + đồng hồ đếm ngược -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Tên đề thi -->
            <div class="flex-1 min-w-0">
                <h1 class="text-base font-semibold text-slate-900 truncate" th:text="${exam?.title}">Tên đề thi</h1>
                <p class="text-xs text-slate-500">
                    Lớp: <span th:text="${exam?.classroomName}">12A1</span>
                    &nbsp;•&nbsp;
                    <span th:text="${exam?.questionCount}">0</span> câu /
                    <span th:text="${exam?.totalScore}">0</span> điểm
                </p>
            </div>
            <!-- Đồng hồ đếm ngược -->
            <div id="timerBlock"
                class="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-100 min-w-[80px] justify-center"
                th:classappend="${exam?.timeLimitMinutes != null ? '' : 'invisible'}">
                <iconify-icon icon="solar:clock-circle-bold" width="18" class="text-violet-600"></iconify-icon>
                <span id="timerDisplay" class="font-mono font-bold text-slate-800 text-lg">--:--</span>
            </div>
            <!-- Nút nộp bài -->
            <button onclick="ExamApp.confirmSubmit()"
                class="px-5 py-2 bg-violet-600 text-white rounded-lg text-sm font-medium hover:bg-violet-700 flex items-center gap-2 shrink-0 transition-colors">
                <iconify-icon icon="solar:check-circle-linear" width="16"></iconify-icon>
                Nộp bài
            </button>
        </div>
    </header>

    <main class="pt-20 pb-12">
        <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 mt-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

                <!-- Panel trái: bảng điều hướng câu hỏi -->
                <div class="md:col-span-1">
                    <div class="bg-white rounded-xl border border-slate-200 p-4 sticky top-24">
                        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">Câu hỏi</h3>
                        <!-- Grid nút điều hướng -->
                        <div id="questionNav" class="grid grid-cols-5 gap-1.5">
                            <!-- Các nút được sinh động bằng JS -->
                        </div>
                        <div class="mt-4 space-y-1.5 text-xs text-slate-500">
                            <div class="flex items-center gap-2">
                                <span class="h-4 w-4 rounded bg-violet-600 inline-block"></span>
                                <span>Đã trả lời</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="h-4 w-4 rounded bg-slate-200 inline-block"></span>
                                <span>Chưa trả lời</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="h-4 w-4 rounded-full border-2 border-violet-500 inline-block"></span>
                                <span>Câu hiện tại</span>
                            </div>
                        </div>
                        <!-- Nộp bài (mobile) -->
                        <button onclick="ExamApp.confirmSubmit()"
                            class="mt-4 w-full px-4 py-2 bg-violet-600 text-white rounded-lg text-sm font-medium hover:bg-violet-700 transition-colors md:hidden">
                            Nộp bài
                        </button>
                    </div>
                </div>

                <!-- Panel phải: khu vực làm bài -->
                <div class="md:col-span-3">
                    <div id="questionContainer">
                        <!-- Các câu hỏi được render bằng JS -->
                    </div>

                    <!-- Điều hướng câu Trước / Sau -->
                    <div class="flex items-center justify-between mt-4">
                        <button onclick="ExamApp.navigatePrev()"
                            id="prevBtn"
                            class="px-5 py-2 text-slate-600 border border-slate-200 rounded-lg text-sm font-medium hover:bg-slate-50 flex items-center gap-2 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                            <iconify-icon icon="solar:arrow-left-linear" width="16"></iconify-icon>
                            Câu trước
                        </button>
                        <span id="questionProgress" class="text-sm text-slate-500">1 / 1</span>
                        <button onclick="ExamApp.navigateNext()"
                            id="nextBtn"
                            class="px-5 py-2 text-slate-600 border border-slate-200 rounded-lg text-sm font-medium hover:bg-slate-50 flex items-center gap-2 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                            Câu sau
                            <iconify-icon icon="solar:arrow-right-linear" width="16"></iconify-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dialog xác nhận nộp bài -->
    <div id="submitDialog" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full">
            <div class="h-12 w-12 rounded-full bg-violet-100 flex items-center justify-center mx-auto mb-4">
                <iconify-icon icon="solar:diploma-linear" width="24" class="text-violet-600"></iconify-icon>
            </div>
            <h3 class="text-lg font-semibold text-slate-900 text-center mb-2">Xác nhận nộp bài</h3>
            <div id="submitSummary" class="text-center text-sm text-slate-500 mb-6"></div>
            <div class="flex gap-3">
                <button onclick="ExamApp.closeSubmitDialog()"
                    class="flex-1 px-4 py-2 text-slate-600 border border-slate-200 rounded-lg text-sm font-medium hover:bg-slate-50">
                    Làm tiếp
                </button>
                <button onclick="ExamApp.submitExam()"
                    id="confirmSubmitBtn"
                    class="flex-1 px-4 py-2 bg-violet-600 text-white rounded-lg text-sm font-medium hover:bg-violet-700">
                    Nộp bài
                </button>
            </div>
        </div>
    </div>

    <!-- Truyền dữ liệu đề thi từ server vào JS qua biến toàn cục -->
    <script th:inline="javascript">
        /* Dữ liệu đề thi được truyền từ DashboardController */
        window.EXAM_DATA = {
            examId:        /*[[${exam?.id}]]*/ null,
            timeLimitMinutes: /*[[${exam?.timeLimitMinutes}]]*/ null,
            questionCount: /*[[${exam?.questionCount}]]*/ 0,
            studentId:     /*[[${studentId}]]*/ null,
            /* submissionId được lưu bởi trang student/exams.html trong sessionStorage */
            submissionId:  null
        };
        /* Danh sách câu hỏi (correctAnswer đã bị ẩn bởi server-side) */
        window.EXAM_QUESTIONS = /*[[${exam?.questions}]]*/ [];
    </script>

    <!-- Anti-Fraud Module: Chống gian lận trong kỳ thi -->
    <script th:src="@{/js/exam-anti-fraud.js}"></script>

    <!-- JS điều khiển giao diện làm bài và đồng hồ đếm ngược -->
    <script th:src="@{/js/student-exam.js}"></script>
</body>
</html>
