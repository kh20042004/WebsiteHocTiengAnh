<!DOCTYPE html>
<html lang="vi" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${exam != null ? exam.title + ' - Kết Quả - English 12 Smart' : 'Kết Quả Bài Thi'}">Kết Quả Bài Thi</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>window.process = { env: { NODE_ENV: 'development' } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>

<body class="bg-slate-50 text-slate-600 antialiased font-sans">
    <!-- TEACHER HEADER với currentPage='exams' -->
    <th:block th:with="currentPage='exams'" th:insert="teacher/shared/header"></th:block>

    <main class="pt-20 pb-12">
        <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
            <!-- Header -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <a href="/dashboard/teacher/exams" class="text-violet-600 hover:text-violet-700 flex items-center gap-1">
                            <iconify-icon icon="solar:arrow-left-linear" width="18"></iconify-icon>
                            Quay lại
                        </a>
                    </div>
                    <a th:href="'/dashboard/teacher/exams/' + ${exam.id} + '/fraud-dashboard'"
                       class="flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition-colors">
                        <iconify-icon icon="solar:shield-warning-linear" width="18"></iconify-icon>
                        Dashboard Gian Lận
                    </a>
                </div>
                <div th:if="${exam != null}">
                    <h1 class="text-3xl font-bold text-slate-900 mb-2" th:text="${exam.title}">Tên đề thi</h1>
                    <p class="text-slate-500">
                        <span th:text="${exam.questionCount}">0</span> câu / 
                        <span th:text="${exam.totalScore}">0</span> điểm
                    </p>
                </div>
            </div>

            <!-- Thống kê tổng quát -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white rounded-xl border border-slate-200 p-4">
                    <div class="text-2xl font-bold text-slate-900 mb-1" th:text="${totalSubmissions}">0</div>
                    <div class="text-xs text-slate-500">Tổng bài nộp</div>
                </div>
                <div class="bg-white rounded-xl border border-slate-200 p-4">
                    <div class="text-2xl font-bold text-emerald-600 mb-1" th:text="${gradedCount}">0</div>
                    <div class="text-xs text-slate-500">Đã chấm điểm</div>
                </div>
                <div class="bg-white rounded-xl border border-slate-200 p-4">
                    <div class="text-2xl font-bold text-violet-600 mb-1" th:text="${totalSubmissions - gradedCount}">0</div>
                    <div class="text-xs text-slate-500">Chờ chấm</div>
                </div>
                <div class="bg-white rounded-xl border border-slate-200 p-4">
                    <div class="text-2xl font-bold text-slate-900 mb-1" th:text="${avgScore}">0.0%</div>
                    <div class="text-xs text-slate-500">Điểm trung bình</div>
                </div>
            </div>

            <!-- Danh sách kết quả -->
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100">
                    <h2 class="text-lg font-semibold text-slate-900">Danh Sách Kết Quả</h2>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Học sinh</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Điểm số</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Phần trăm</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Thời gian</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Trạng thái</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200">
                            <!-- Không có bài nộp -->
                            <tr th:if="${submissions.isEmpty()}" class="bg-white hover:bg-slate-50">
                                <td colspan="6" class="px-6 py-8 text-center">
                                    <div class="flex flex-col items-center justify-center">
                                        <iconify-icon icon="solar:document-blank-broken" width="32" class="text-slate-300 mb-2"></iconify-icon>
                                        <p class="text-slate-500">Chưa có bài nộp nào</p>
                                    </div>
                                </td>
                            </tr>

                            <!-- Duyệt các bài nộp -->
                            <tr th:each="submission : ${submissions}" class="bg-white hover:bg-slate-50 transition-colors">
                                <td class="px-6 py-4">
                                    <div class="font-medium text-slate-900" th:text="${submission.studentName}">Tên học sinh</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="font-semibold text-slate-900" th:text="${submission.scoreDisplay}">0/10</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-2">
                                        <div class="w-16 bg-slate-200 rounded-full h-2">
                                            <div class="bg-violet-600 h-2 rounded-full transition-all"
                                                th:style="'width: ' + ${submission.percentage ?: 0} + '%'"></div>
                                        </div>
                                        <span class="text-sm font-medium text-slate-700" th:text="${submission.percentageDisplay}">0%</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="text-sm text-slate-600" th:text="${submission.timeTakenDisplay}">N/A</span>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                                        th:classappend="${submission.status == 'GRADED'} ? 'bg-emerald-100 text-emerald-800' : (${submission.status == 'SUBMITTED'} ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-800')"
                                        th:text="${submission.status == 'GRADED' ? 'Đã chấm' : (submission.status == 'SUBMITTED' ? 'Chờ chấm' : submission.status)}">
                                        Status
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-2">
                                        <a th:href="'/dashboard/teacher/exams/' + ${exam.id} + '/submission/' + ${submission.id}"
                                            class="text-violet-600 hover:text-violet-700 text-sm font-medium flex items-center gap-1">
                                            <iconify-icon icon="solar:eye-linear" width="16"></iconify-icon>
                                            Xem bài
                                        </a>
                                        <a th:href="'/dashboard/teacher/exams/' + ${exam.id} + '/submissions/' + ${submission.id} + '/fraud-detail'"
                                            class="text-red-600 hover:text-red-700 text-sm font-medium flex items-center gap-1">
                                            <iconify-icon icon="solar:shield-warning-linear" width="16"></iconify-icon>
                                            Fraud
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Footer với thông tin -->
                <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 text-sm text-slate-500">
                    <p>Tổng cộng: <strong class="text-slate-700" th:text="${totalSubmissions}">0</strong> bài nộp</p>
                </div>
            </div>

            <!-- Nút hành động -->
            <div class="mt-8 flex gap-3">
                <a href="/dashboard/teacher/exams"
                    class="px-6 py-3 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200 transition-colors flex items-center gap-2">
                    <iconify-icon icon="solar:arrow-left-linear" width="18"></iconify-icon>
                    Quay lại
                </a>
            </div>
        </div>
    </main>

    <!-- TEACHER FOOTER -->
    <th:block th:insert="teacher/shared/footer"></th:block>
</body>

</html>
